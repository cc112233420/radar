<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PULSE RADAR · 币安合约异动雷达</title>
<style>
:root{--bg:#0b0e14;--panel:#131924;--line:#1f2838;--txt:#dde5f0;--dim:#7d899c;--up:#ff4d5e;--dn:#22c58b;--acc:#5b8cff;--warn:#ffb020}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"PingFang SC",sans-serif}
header{position:sticky;top:0;z-index:9;background:rgba(11,14,20,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:15px;letter-spacing:.5px}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line)}
.badge.live{color:var(--dn);border-color:var(--dn)}
.badge.demo{color:var(--warn);border-color:var(--warn)}
.badge.wait{color:var(--dim)}
#cd{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
.bar{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
.bar input,.bar select,.bar button{background:#0d1320;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:13px}
.bar input{width:86px}
.bar button.on{border-color:var(--acc);color:var(--acc)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;color:var(--dim);font-weight:500;cursor:pointer;position:sticky;top:52px;background:var(--panel)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
td:first-child{font-weight:600}
.up{color:var(--up)} .dn{color:var(--dn)}
.sig{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;margin-left:5px;background:#1c2740;color:#9db9ff}
tr.hit td{background:rgba(255,77,94,.06)}
tr{cursor:pointer}
#log{padding:10px 14px;font-size:12px;color:var(--dim)}
#log div{padding:3px 0;border-bottom:1px dashed var(--line)}
canvas{width:110px;height:34px;vertical-align:middle}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;width:100%}
.box h3{margin-bottom:10px}
.box canvas{width:100%;height:220px}
.x{float:right;color:var(--dim);cursor:pointer;font-size:18px}
</style>
</head>
<body>
<header>
  <h1>⚡ PULSE RADAR</h1>
  <span id="st" class="badge wait">连接中…</span>
  <span id="cd">–</span>
  <span style="flex:1"></span>
  <button id="sndBtn" class="on">🔔 提示音</button>
</header>
<div class="bar">
  <select id="tf"><option value="1m">1分钟</option><option value="5m" selected>5分钟</option><option value="15m">15分钟</option></select>
  <label>涨幅≥ <input id="pct" type="number" step="0.1" value="1.5">%</label>
  <label>OI≥ <input id="oi" type="number" step="0.5" value="2">%</label>
  <label>费率≥ <input id="fr" type="number" step="0.01" value="0.05">%</label>
  <select id="oif"><option value="5m" selected>5m</option><option value="15m">15m</option><option value="30m">30m</option><option value="1h">1h</option></select>
  <input id="q" placeholder="搜索币种">
</div>
<div class="wrap">
<table id="tbl">
<thead><tr>
<th data-k="sym">合约</th><th data-k="price">价格</th>
<th data-k="chg1">1m%</th><th data-k="chg5">5m%</th><th data-k="chg15">15m%</th>
<th data-k="oi">持仓量</th><th data-k="oiChg">OI变化%</th><th data-k="funding">费率%</th>
<th>信号</th><th>走势</th>
</tr></thead><tbody></tbody>
</table>
</div>
<div id="log"><b>最近异动</b></div>

<div class="modal" id="md"><div class="box"><span class="x" onclick="md.classList.remove('show')">✕</span><h3 id="mt"></h3><canvas id="mc" width="1000" height="440"></canvas><div id="mi" style="margin-top:8px;color:var(--dim);font-size:12px"></div></div></div>

<script>
const API='https://fapi.binance.com';
const $=id=>document.getElementById(id);
let coins=[],sortK='vol',sortD=-1,mode='wait',sound=true,ctxT,actx;
const S={tf:'5m',pct:1.5,oi:2,fr:0.05,oif:'5m',q:''};
$('tf').onchange=e=>{S.tf=e.target.value;refresh()};
$('oif').onchange=e=>{S.oif=e.target.value};
$('pct').oninput=e=>S.pct=+e.target.value||1.5;
$('oi').oninput=e=>S.oi=+e.target.value||2;
$('fr').oninput=e=>S.fr=+e.target.value||.05;
$('q').oninput=e=>{S.q=e.target.value.trim().toUpperCase();render()};
$('sndBtn').onclick=()=>{sound=!sound;$('sndBtn').classList.toggle('on',sound)};
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;if(sortK===k)sortD*=-1;else{sortK=k;sortD=-1}render()});

function beep(f=880){if(!sound||!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.25);o.start();o.stop(actx.currentTime+.26)}
document.addEventListener('touchstart',()=>{if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}},{once:true});

async function j(p){const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);
  try{const r=await fetch(API+p,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}}

function fmt(n,d=2){return n==null||isNaN(n)?'–':(+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function cls(v){return v>0?'up':v<0?'dn':''}
function arrows(v,d=2){if(v==null||isNaN(v))return '–';const c=cls(v);const a=v>0?'▲':v<0?'▼':'';return `<span class="${c}">${a} ${fmt(Math.abs(v),d)}</span>`}

async function loadUniverse(){
  const t=await j('/fapi/v1/ticker/24hr');
  coins=t.filter(x=>x.symbol.endsWith('USDT')&&!/(UP|DOWN|BULL|BEAR)USDT$/.test(x.symbol))
    .sort((a,b)=>b.quoteVolume-a.quoteVolume).slice(0,40)
    .map(x=>({sym:x.symbol,price:+x.lastPrice,vol:+x.quoteVolume,chg1:null,chg5:null,chg15:null,oi:null,oiChg:null,funding:null,k:null}));
}
async function refreshLive(){
  if(!coins.length)await loadUniverse();
  const pm=await j('/fapi/v1/premiumIndex');
  const fm={};pm.forEach(x=>fm[x.symbol]=+x.lastFundingRate*100);
  await Promise.allSettled(coins.map(async c=>{
    const [k,oh]=await Promise.all([
      j(`/fapi/v1/klines?symbol=${c.sym}&interval=1m&limit=17`).catch(()=>null),
      j(`/fapi/v1/openInterestHist?symbol=${c.sym}&period=${S.oif}&limit=2`).catch(()=>null)]);
    if(k&&k.length>=16){
      c.k=k.map(x=>+x[4]);const last=c.k[c.k.length-1];
      c.price=last;
      c.chg1=(last/c.k[c.k.length-2]-1)*100;
      c.chg5=(last/c.k[c.k.length-6]-1)*100;
      c.chg15=(last/c.k[c.k.length-16]-1)*100;}
    if(oh&&oh.length>=2){const a=+oh[0].sumOpenInterest,b=+oh[1].sumOpenInterest;
      if(a>0){c.oi=b;c.oiChg=(b/a-1)*100}}
    c.funding=fm[c.sym]??null;}));
}
function sigs(c){
  const s=[];const p=c[S.tf==='1m'?'chg1':S.tf==='15m'?'chg15':'chg5'];
  if(p!=null&&c.oiChg!=null){
    if(p>0&&c.oiChg>0)s.push('多头增仓进攻');
    else if(p>0&&c.oiChg<0)s.push('空头回补拉升');
    else if(p<0&&c.oiChg>0)s.push('空头增仓施压');
    else if(p<0&&c.oiChg<0)s.push('多头减仓退潮');}
  if(c.funding>=S.fr)s.push('费率偏高·多头拥挤');
  if(c.funding<=-S.fr)s.push('费率偏低·空头拥挤');
  return s;
}
const hits=[];
function check(c){
  const p=c[S.tf==='1m'?'chg1':S.tf==='15m'?'chg15':'chg5'];
  if(p!=null&&Math.abs(p)>=S.pct||c.oiChg!=null&&Math.abs(c.oiChg)>=S.oi||(c.funding!=null&&Math.abs(c.funding)>=S.fr)){
    const t=new Date().toLocaleTimeString('zh-CN',{hour12:false});
    const msg=`${t} ${c.sym} 涨跌${fmt(p)}% OI ${fmt(c.oiChg)}% 费率 ${fmt(c.funding)}`;
    if(!hits.includes(msg)){hits.unshift(msg);hits.length=Math.min(hits.length,30);beep(p>=0?880:520)}}
}
function render(){
  const tb=document.querySelector('#tbl tbody');
  const list=coins.filter(c=>!S.q||c.sym.includes(S.q))
    .sort((a,b)=>{const x=a[sortK],y=b[sortK];return (x==null?-1e15:x)-(y==null?-1e15:y)*sortD});
  tb.innerHTML=list.map(c=>{
    const p=c[S.tf==='1m'?'chg1':S.tf==='15m'?'chg15':'chg5'];
    const isHit=(p!=null&&Math.abs(p)>=S.pct)||(c.oiChg!=null&&Math.abs(c.oiChg)>=S.oi)||(c.funding!=null&&Math.abs(c.funding)>=S.fr);
    return `<tr class="${isHit?'hit':''}" data-s="${c.sym}">
    <td>${c.sym.replace('USDT','')}</td><td>${fmt(c.price,c.price>100?2:4)}</td>
    <td>${arrows(c.chg1)}</td><td>${arrows(c.chg5)}</td><td>${arrows(c.chg15)}</td>
    <td>${c.oi==null?'–':fmt(c.oi,0)}</td><td>${arrows(c.oiChg)}</td>
    <td class="${cls(c.funding)}">${fmt(c.funding,3)}</td>
    <td>${sigs(c).map(s=>`<span class="sig">${s}</span>`).join('')||'—'}</td>
    <td><canvas data-c="${c.sym}" width="220" height="68"></canvas></td></tr>`}).join('');
  tb.querySelectorAll('canvas').forEach(cv=>{const c=coins.find(x=>x.sym===cv.dataset.c);if(c&&c.k)spark(cv,c.k)});
  tb.querySelectorAll('tr').forEach(tr=>tr.onclick=()=>detail(tr.dataset.s));
  $('log').innerHTML='<b>最近异动</b>'+(hits.length?hits.map(h=>`<div>${h}</div>`).join(''):'<div>暂无异动</div>');
}
function spark(cv,arr){const g=cv.getContext('2d');const w=cv.width,h=cv.height;g.clearRect(0,0,w,h);
  const mn=Math.min(...arr),mx=Math.max(...arr),rg=mx-mn||1;
  const up=arr[arr.length-1]>=arr[0];
  g.strokeStyle=up?'#ff4d5e':'#22c58b';g.lineWidth=2.5;g.beginPath();
  arr.forEach((v,i)=>{const x=i/(arr.length-1)*w,y=h-(v-mn)/rg*(h-8)-4;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()}
function detail(sym){
  const c=coins.find(x=>x.sym===sym);if(!c||!c.k)return;
  $('mt').textContent=sym+' · 1分钟走势';
  $('mi').textContent=`现价 ${fmt(c.price,4)} · 5m ${fmt(c.chg5)}% · 15m ${fmt(c.chg15)}% · OI变化 ${fmt(c.oiChg)}% · 费率 ${fmt(c.funding,3)}%`;
  const cv=$('mc');cv.width=1000;cv.height=440;const g=cv.getContext('2d');
  const arr=c.k,mn=Math.min(...arr),mx=Math.max(...arr),rg=mx-mn||1;
  g.clearRect(0,0,1000,440);g.strokeStyle='#5b8cff';g.lineWidth=4;g.beginPath();
  arr.forEach((v,i)=>{const x=i/(arr.length-1)*980+10,y=430-(v-mn)/rg*400;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
  md.classList.add('show');
}
/* 演示模式 */
const DS=['BTC','ETH','SOL','BNB','XRP','DOGE','ADA','AVAX','LINK','TON','TRX','DOT','NEAR','APT','ARB','OP','SUI','PEPE','FIL','ATOM','LTC','INJ','TIA','SEI','ORDI','FET','AAVE','UNI','STX','RUNE','CFX','GALA','SAND','AXS','CRV','BLUR','WIF','ETC','BCH','FTM'];
function seedDemo(){coins=DS.map(s=>{const p=Math.pow(10,(Math.random()*4-2));return{sym:s+'USDT',price:p,vol:Math.random()*9e8,chg1:0,chg5:0,chg15:0,oi:p*1e4*Math.random(),oiChg:0,funding:(Math.random()-.4)*.08,k:Array.from({length:17},()=>p*(1+(Math.random()-.5)*.02))}})}
function tickDemo(){coins.forEach(c=>{const w=(Math.random()-.5)*.006;
  c.price*=1+w;c.k.push(c.price);c.k.shift();
  c.chg1=(c.price/c.k[c.k.length-2]-1)*100;
  c.chg5=(c.price/c.k[c.k.length-6]-1)*100;
  c.chg15=(c.price/c.k[0]-1)*100;
  c.oiChg=(Math.random()-.5)*6;c.oi*=1+c.oiChg/100;
  c.funding+= (Math.random()-.5)*.01;
  if(Math.random()<.06)c.chg5+=(Math.random()-.3)*4;});}
function setMode(m,msg){mode=m;const b=$('st');
  b.className='badge '+(m==='live'?'live':'demo');
  b.textContent=m==='live'?'● 实时 · 币安已连接':'● 演示数据 · '+(msg||'币安不可达')}
let cd=0;
async function refresh(){
  if(mode==='demo'){tickDemo();render();return}
  try{setMode('wait','连接中…');$('st').textContent='● 连接币安…';$('st').className='badge wait';
    await refreshLive();setMode('live');coins.forEach(check);render();}
  catch(e){seedDemo();setMode('demo','已自动降级');render();return}
  cd=15;
}
setInterval(()=>{if(cd>0){cd--;$('cd').textContent=mode==='live'?`刷新 ${cd}s`:mode==='demo'?'演示 · 模拟行情':'–';if(cd===0&&mode==='live')refresh()}},1000);
setInterval(()=>{if(mode==='demo')refresh()},3000);
refresh();
</script>
</body>
</html>
